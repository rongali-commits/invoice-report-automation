[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoice-report-automation"
version = "1.0.0"
description = "A client-style Python workflow for validating billing data and generating invoice-ready outputs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rongali Chaitanya" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[project.scripts]
invoice-automation = "invoice_automation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_automation"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
